name: Windows 安装版发布

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 版本标签
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    concurrency:
      group: windows-release-${{ inputs.tag || github.ref_name }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: 校验版本
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          if ($env:RELEASE_TAG -ne "v$version") { throw '版本标签与 package.json 不一致。' }
      - name: 构建 Windows 安装包
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run dist
      - name: 生成发布备注
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = gh api --method POST "repos/$env:GITHUB_REPOSITORY/releases/generate-notes" -f "tag_name=$env:RELEASE_TAG" --jq .body
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $notes | Set-Content -LiteralPath 'release/xj-agent-release-notes.md' -Encoding utf8
      - name: 签名更新清单和发布备注
        shell: pwsh
        env:
          XJ_AGENT_UPDATE_SIGNING_KEY: ${{ secrets.XJ_AGENT_UPDATE_SIGNING_KEY }}
        run: node scripts/sign-release.cjs 'release/xj-agent-release-notes.md'
      - name: 发布到 GitHub Releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = node -p "require('./package.json').version"
          $name = "XJ-Agent-Setup-$version-x64.exe"
          $exe = Join-Path 'release' $name
          $sha = "$exe.sha256"
          gh release create $env:RELEASE_TAG $exe $sha 'release/xj-agent-install-update.json' 'release/xj-agent-release-notes.json' --verify-tag --title "小金同学 $version" --notes-file 'release/xj-agent-release-notes.md'
