<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小金同学 · 交互预览</title><style>
*{box-sizing:border-box}body{margin:0;background:#e9f3f8;color:#213b4c;font-family:'Microsoft YaHei',sans-serif}.wrap{max-width:1120px;margin:48px auto;padding:0 24px}.eyebrow{letter-spacing:.18em;color:#6395ae;font-size:12px;font-weight:bold}h1{font-size:40px;margin:8px 0}p{line-height:1.8;color:#6c8491}.board{display:grid;grid-template-columns: .8fr 1.2fr;gap:22px;margin-top:28px}.pet,.panel{background:#fff;border:1px solid #d7e9f1;border-radius:28px;box-shadow:0 18px 60px #547a8a18}.pet{min-height:570px;display:flex;flex-direction:column;align-items:center;justify-content:end;padding:28px;background:radial-gradient(circle at 50% 40%,#fff 0,#eaf7fd 55%,#dbedf5 100%)}.pet img{width:100%;height:420px;object-fit:contain}.hint{border-radius:20px;background:#fff;padding:15px 22px;box-shadow:0 8px 30px #4b819a20;font-size:14px}.panel{padding:28px}.top{display:flex;justify-content:space-between;align-items:center}.badge{background:#e9f7ee;color:#4b9270;border-radius:20px;padding:7px 12px;font-size:12px}.sub{font-size:13px;color:#839aa5}nav{display:flex;gap:8px;margin:26px 0}button{border:0;cursor:pointer;font:inherit}nav button{padding:10px 16px;border-radius:12px;background:#f1f7fa;color:#7593a2}nav button.active{background:#25495d;color:white}.card{border:1px solid #e4f0f5;border-radius:18px;padding:18px;margin:12px 0}.small{font-size:12px;color:#88a1ad}.msg{background:#eef7fb;border-radius:4px 18px 18px 18px;padding:16px;line-height:1.7;font-size:14px}.input{display:flex;gap:10px;margin-top:24px}input{width:100%;border:1px solid #dcebf1;border-radius:14px;padding:14px;font:inherit}.send{background:#315c72;color:white;border-radius:14px;padding:0 18px}.note{font-size:12px;color:#8ca3ae;margin-top:18px}@media(max-width:720px){.board{grid-template-columns:1fr}.pet{min-height:400px}.pet img{height:300px}}
</style></head><body><main class="wrap"><div class="eyebrow">JINKRA / DESKTOP COMPANION</div><h1>嗨，我是小金同学。</h1><p>陪你完成工作，也在需要你的时候轻轻提醒。</p><div class="board"><section class="pet"><div class="hint" id="bubble">💬 今天想让我帮你做些什么？ ✦</div><img src="小金同学-初版立绘.png" alt="小金同学立绘（生成完成后显示）"><div style="display:flex;gap:8px;margin-top:14px"><button id="demoDone" style="padding:8px;border-radius:10px;background:white">模拟任务完成</button><button id="demoApproval" style="padding:8px;border-radius:10px;background:white">模拟请求批准</button></div></section><section class="panel"><div class="top"><div><strong>小金的工作台</strong><div class="sub">Codex 桌面伙伴 · 概念预览</div></div><span class="badge">设计演示</span></div><nav><button class="active" data-tab="chat">对话</button><button data-tab="tasks">任务</button><button data-tab="usage">用量</button></nav><div id="content"></div><div class="note">这是交互设计预览，数据与按钮仅作演示，尚未连接 Codex 或账单。</div></section></div></main><script>
const views={chat:`<div class="card"><div class="small">当前工作区</div><p>选择你要处理的项目文件夹</p></div><div class="msg">我在这里。告诉我你的想法，我会把任务交给 Codex，完成后提醒你。</div><div class="input"><input placeholder="跟小金说点什么…" aria-label="演示输入"><button class="send">发送</button></div>`,tasks:`<div class="card"><div class="small">进行中的任务</div><p>连接 Codex 后，在这里查看任务状态。</p></div><div class="card"><strong>需要你确认</strong><p>审批请求会展示操作内容，并由你决定是否继续。</p></div>`,usage:`<div class="card"><div class="small">Codex 订阅额度</div><p>连接账户后显示可获取的额度和重置时间。</p></div><div class="card"><div class="small">OpenAI API 费用</div><p>单独连接有权限的组织账户后显示实际费用。</p></div>`};function show(t){document.querySelector('#content').innerHTML=views[t];document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));document.querySelector('#bubble').textContent={chat:'今天想让我帮你做些什么？ ✦',tasks:'任务有进展，我会告诉你。',usage:'额度和费用，我帮你分开看。'}[t]}document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>show(b.dataset.tab));show('chat');document.querySelector('#demoDone').onclick=()=>document.querySelector('#bubble').textContent='💬 这个任务完成啦！';document.querySelector('#demoApproval').onclick=()=>document.querySelector('#bubble').textContent='💬 这里需要你确认一下。';
</script></body></html>
